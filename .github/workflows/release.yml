name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 26

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Resolve changelog
        run: |
          version_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          changelog_file="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          if [ -f "$changelog_file" ]; then
            cp "$changelog_file" release-notes.txt
          else
            echo "Release ${{ github.ref_name }}." > release-notes.txt
          fi

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/CalendarTile-${{ github.ref_name }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.txt
          files: release-artifacts/*.apk
